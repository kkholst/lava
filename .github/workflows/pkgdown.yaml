name: pkgdown
on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
permissions:
  contents: write
  pull-requests: write
jobs:
  pkgdown:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest,  r: 'release'}

    concurrency:
      group: 'pkgdown-${{ github.event_name != ''pull_request'' || github.run_id }}'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate custom token
        id: generate-token
        if:  ${{ inputs.generate_token }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.TOKEN_APP_ID }}
          private-key: ${{ secrets.TOKEN_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: Package specific setup
        if:  ${{ inputs.use_local_setup_action }}
        uses: ./.github/actions/setup
      - uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true
      - name: Install libpoppler-cpp-dev # required to install pdftools (R pkg)
        run: sudo apt-get install -y pandoc libcurl4-openssl-dev libharfbuzz-dev libfribidi-dev libpoppler-cpp-dev

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        env:
          GITHUB_PAT: ${{ steps.generate-token.outputs.token || secrets.GITHUB_TOKEN }}
        with:
          extra-packages: 'any::pkgdown, any::devtools, local::.'
          needs: website
      - uses: r-lib/actions/setup-tinytex@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
      - name: Build site
        run: 'pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)'
        shell: 'Rscript {0}'
      - name: "Deploy to GitHub pages \U0001F680"
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
      - name: Add pkgdown PR Comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v2
        if: github.event_name == 'pull_request'
        with:
          recreate: true
          header: pkgdown
          message: >
            # Github pages

            Review the pkgdown webpage for the PR [here](https://${{
            github.repository_owner }}.github.io/${{
            github.event.repository.name }}/dev/${{
            github.event.pull_request.number }})
      - name: Copy page to temp folder
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p /home/runner/work/dev
          cp -r ./docs/* /home/runner/work/dev
      - name: Check out gh-pages branch
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
      - name: Copy and push to gh-pages
        if: github.event_name == 'pull_request'
        run: >
          mkdir -p dev/${{ github.event.pull_request.number }}

          cp -r /home/runner/work/dev/* ./dev/${{
          github.event.pull_request.number }}

          git config --global user.email "actions-robot@novonordisk.com"

          git config --global user.name "Actions Robot From Github Actions"

          git add .

          git commit -m "Update gh pages from the PR"

          git push
